[project]
name = "geoshelter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "userpy", email = "dima6225@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pyqt6>=6.11.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "simplekml>=1.3.6",
]

[dependency-groups]
build = [
    "pillow>=10.0",
    "pyinstaller>=6.0",
]

[project.scripts]
geoshelter = "main:main"
geoshelter-cli = "cli:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.uv]
# simplekml 1.3.6 uses legacy setup metadata that newer setuptools rejects.
build-constraint-dependencies = ["setuptools==80.9.0"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "cli"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["application*", "assets*", "domain*", "infrastructure*", "presentation*"]

[tool.setuptools.package-data]
assets = ["*.svg"]
